<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel da gerência | Beach Hills</title>
    <link rel="stylesheet" href="admin/admin.css">
    <script type="module" src="admin.js"></script>
</head>
<body>
    <section id="login-view" class="login-view" aria-labelledby="titulo-login">
        <div class="login-visual" aria-hidden="true">
            <img src="https://media.omnibees.com/Images/9865/Property/1285667.jpg" alt="">
            <div class="login-visual-text">
                <p>BEACH HILLS</p>
                <strong>Gestão de avaliações dos hóspedes</strong>
            </div>
        </div>

        <div class="login-side">
            <div class="login-card">
                <img
                    class="login-logo"
                    src="https://irp.cdn-website.com/eba97c45/dms3rep/multi/opt/logo+beach+hills-640w.png"
                    alt="Beach Hills"
                >
                <h1 id="titulo-login">Acesso da gerência</h1>
                <p class="login-subtitle">Entre para moderar os comentários do site.</p>

                <form id="login-form">
                    <label for="email-admin">E-mail</label>
                    <input id="email-admin" name="email" type="email" autocomplete="email" required>

                    <label for="senha-admin">Senha</label>
                    <input id="senha-admin" name="password" type="password" autocomplete="current-password" required>

                    <button type="submit">Entrar</button>
                </form>

                <p id="admin-message" class="login-message" role="status" aria-live="polite"></p>
                <a class="back-link" href="index.html">← Voltar para o site</a>
            </div>
        </div>
    </section>

    <div id="dashboard-view" class="dashboard" hidden>
        <header class="topbar">
            <div class="topbar-brand">
                <img
                    src="https://irp.cdn-website.com/eba97c45/dms3rep/multi/opt/logo+beach+hills-640w.png"
                    alt="Beach Hills"
                >
                <span>Painel da gerência</span>
            </div>
            <div class="topbar-user">
                <span id="user-email" class="user-email"></span>
                <button id="logout-button" class="ghost-button" type="button">Sair</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="dashboard-heading">
                <div>
                    <h1>Avaliações dos hóspedes</h1>
                    <p>Publique os comentários aprovados ou exclua os que não devem aparecer no site.</p>
                </div>
                <button id="refresh-button" class="ghost-button" type="button">Atualizar</button>
            </div>

            <section class="stats" aria-label="Resumo">
                <article class="stat-card stat-pending">
                    <span class="stat-label">Aguardando</span>
                    <strong id="stat-pending">0</strong>
                </article>
                <article class="stat-card stat-published">
                    <span class="stat-label">Publicados</span>
                    <strong id="stat-published">0</strong>
                </article>
                <article class="stat-card stat-average">
                    <span class="stat-label">Nota média</span>
                    <strong id="stat-average">—</strong>
                </article>
            </section>

            <section class="board" aria-label="Comentários">
                <div class="tabs" role="tablist">
                    <button id="tab-pending" class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="pending">
                        Aguardando <span id="tab-pending-count" class="tab-count">0</span>
                    </button>
                    <button id="tab-published" class="tab" type="button" role="tab" aria-selected="false" data-tab="published">
                        Publicados <span id="tab-published-count" class="tab-count">0</span>
                    </button>
                </div>

                <p id="board-message" class="board-message" role="status" aria-live="polite"></p>
                <div id="comments-board" class="comments-board"></div>
            </section>
        </main>
    </div>
</body>
</html>
