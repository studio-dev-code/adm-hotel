<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compartilhe sua experiência no Beach Hills.">
    <title>Comentários | Beach Hills</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="public.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#inicio" aria-label="Beach Hills - início">
            <img
                src="https://irp.cdn-website.com/eba97c45/dms3rep/multi/opt/logo+beach+hills-640w.png"
                alt="Beach Hills"
            >
            <span>Comentários</span>
        </a>
        <nav aria-label="Navegação principal">
            <a href="#comentarios">Comentários</a>
        </nav>
    </header>

    <main id="inicio">
        <section class="guest-hero" aria-labelledby="titulo-principal">
            <img
                src="https://media.omnibees.com/Images/9865/Property/1285667.jpg"
                alt="Piscina e área de lazer do Beach Hills em um dia ensolarado"
            >
            <div class="guest-hero-content">
                <p class="eyebrow">BEACH HILLS</p>
                <h1 id="titulo-principal">Conte como foi sua experiência</h1>
                <p>Sua opinião ajuda outros hóspedes a planejar momentos especiais.</p>
            </div>
        </section>

        <div class="content-grid public-grid">
            <section class="panel" id="comentarios" aria-labelledby="titulo-formulario">
                <h2 id="titulo-formulario">Deixe sua avaliação</h2>
                <form id="comment-form">
                    <label for="nome">Seu nome</label>
                    <input id="nome" name="nome" type="text" maxlength="80" autocomplete="name" required>

                    <fieldset class="rating-field">
                        <legend>Sua nota</legend>
                        <div class="star-rating">
                            <input id="nota-1" name="nota" type="radio" value="1" required>
                            <label for="nota-1" aria-label="1 estrela">★</label>
                            <input id="nota-2" name="nota" type="radio" value="2">
                            <label for="nota-2" aria-label="2 estrelas">★</label>
                            <input id="nota-3" name="nota" type="radio" value="3">
                            <label for="nota-3" aria-label="3 estrelas">★</label>
                            <input id="nota-4" name="nota" type="radio" value="4">
                            <label for="nota-4" aria-label="4 estrelas">★</label>
                            <input id="nota-5" name="nota" type="radio" value="5">
                            <label for="nota-5" aria-label="5 estrelas">★</label>
                        </div>
                    </fieldset>

                    <label for="comentario">Seu comentário</label>
                    <textarea id="comentario" name="comentario" rows="5" maxlength="2000" required></textarea>

                    <p class="form-note">Seu comentário poderá aparecer no site em alguns minutos.</p>
                    <button type="submit">Enviar comentário</button>
                    <p id="form-message" class="status-message" role="status" aria-live="polite"></p>
                </form>
            </section>

            <section class="panel" aria-labelledby="titulo-comentarios">
                <h2 id="titulo-comentarios">Avaliações publicadas</h2>
                <p id="comments-message" class="empty-state" role="status" aria-live="polite">
                    Carregando avaliações...
                </p>
                <div id="comments-list" class="comments-list"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Beach Hills</p>
    </footer>
</body>
</html>
